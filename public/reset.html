<!DOCTYPE html>
<html>

<head>
    <title>AccountingFlow - Reset Data</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0B1221;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #151D2E;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
        }

        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background: #dc2626;
        }

        .safe {
            background: #10b981;
        }

        .safe:hover {
            background: #059669;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #1e293b;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔧 AccountingFlow Data Reset</h1>
        <p>현재 LocalStorage에 저장된 데이터를 초기화합니다.</p>

        <button onclick="clearAll()">🗑️ 모든 데이터 삭제</button>
        <button class="safe" onclick="clearLedgerOnly()">📊 장부만 삭제 (설정 유지)</button>

        <div id="result"></div>
    </div>

    <script>
        function clearAll() {
            const keys = Object.keys(localStorage);
            const accountingKeys = keys.filter(k => k.startsWith('accounting_'));

            accountingKeys.forEach(key => localStorage.removeItem(key));

            document.getElementById('result').innerHTML =
                `✅ 삭제 완료: ${accountingKeys.length}개 항목<br>` +
                `삭제된 키: ${accountingKeys.join(', ')}<br><br>` +
                `<a href="/" style="color: #60a5fa;">메인 페이지로 이동</a>`;
        }

        function clearLedgerOnly() {
            localStorage.removeItem('accounting_ledger');
            localStorage.removeItem('accounting_candidate_ledger');

            document.getElementById('result').innerHTML =
                `✅ 장부 데이터만 삭제 완료<br>` +
                `설정, 자산, 리스 데이터는 유지됨<br><br>` +
                `<a href="/" style="color: #60a5fa;">메인 페이지로 이동</a>`;
        }

        // Show current data size
        window.onload = () => {
            const ledger = localStorage.getItem('accounting_ledger');
            if (ledger) {
                const entries = JSON.parse(ledger);
                document.getElementById('result').innerHTML =
                    `📊 현재 장부: ${entries.length}개 거래<br>` +
                    `💾 크기: ${(ledger.length / 1024).toFixed(2)} KB`;
            } else {
                document.getElementById('result').innerHTML = '📭 저장된 데이터 없음';
            }
        };
    </script>
</body>

</html>
