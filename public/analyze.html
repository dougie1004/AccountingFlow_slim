<!DOCTYPE html>
<html>

<head>
    <title>AccountingFlow - Data Analyzer</title>
    <style>
        body {
            font-family: 'Consolas', monospace;
            background: #0B1221;
            color: #e2e8f0;
            padding: 20px;
        }

        .section {
            background: #151D2E;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h2 {
            color: #60a5fa;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #1e293b;
            color: #fbbf24;
        }

        .error {
            color: #ef4444;
            font-weight: bold;
        }

        .warning {
            color: #f59e0b;
        }

        .success {
            color: #10b981;
        }
    </style>
</head>

<body>
    <h1>🔍 AccountingFlow Data Analyzer</h1>

    <div class="section">
        <h2>📊 Ledger Summary</h2>
        <div id="summary"></div>
    </div>

    <div class="section">
        <h2>💰 Cash Flow Analysis</h2>
        <div id="cashFlow"></div>
    </div>

    <div class="section">
        <h2>🚨 Suspicious Transactions</h2>
        <div id="suspicious"></div>
    </div>

    <script>
        const ledgerData = localStorage.getItem('accounting_ledger');

        if (!ledgerData) {
            document.body.innerHTML = '<h1 class="error">❌ No ledger data found</h1>';
        } else {
            const ledger = JSON.parse(ledgerData);
            const approved = ledger.filter(e => e.status === 'Approved');

            // Summary
            document.getElementById('summary').innerHTML = `
                <p>Total Entries: <strong>${ledger.length}</strong></p>
                <p>Approved: <strong class="success">${approved.length}</strong></p>
                <p>Pending: <strong class="warning">${ledger.length - approved.length}</strong></p>
            `;

            // Cash Flow Analysis
            let cashIn = 0, cashOut = 0;
            const cashAccounts = ['현금', '보통예금', 'cash', 'bank'];

            const isCash = (account) => {
                const lower = (account || '').toLowerCase();
                return cashAccounts.some(c => lower.includes(c));
            };

            approved.forEach(e => {
                const total = (e.amount || 0) + (e.vat || 0);
                const isCashDebit = isCash(e.debitAccount);
                const isCashCredit = isCash(e.creditAccount);

                if (isCashDebit && !isCashCredit) {
                    cashIn += total;
                } else if (isCashCredit && !isCashDebit) {
                    cashOut += total;
                }
            });

            const netCash = cashIn - cashOut;
            const isExplosion = Math.abs(netCash) > 10_000_000_000;

            document.getElementById('cashFlow').innerHTML = `
                <p>Cash Inflow: <strong class="success">₩${cashIn.toLocaleString()}</strong></p>
                <p>Cash Outflow: <strong class="error">₩${cashOut.toLocaleString()}</strong></p>
                <p>Net Cash: <strong class="${isExplosion ? 'error' : 'success'}">₩${netCash.toLocaleString()}</strong></p>
                ${isExplosion ? '<p class="error">🚨 EXPLOSION DETECTED!</p>' : ''}
            `;

            // Suspicious Transactions
            const suspicious = approved.filter(e => {
                const total = (e.amount || 0) + (e.vat || 0);
                return total > 1_000_000_000 || // > 10억
                    (isCash(e.debitAccount) && isCash(e.creditAccount)); // Internal transfer
            });

            if (suspicious.length > 0) {
                let html = '<table><tr><th>Date</th><th>Description</th><th>Debit</th><th>Credit</th><th>Amount</th></tr>';
                suspicious.slice(0, 20).forEach(e => {
                    const total = (e.amount || 0) + (e.vat || 0);
                    html += `<tr>
                        <td>${e.date}</td>
                        <td>${e.description}</td>
                        <td>${e.debitAccount}</td>
                        <td>${e.creditAccount}</td>
                        <td class="${total > 1_000_000_000 ? 'error' : ''}">₩${total.toLocaleString()}</td>
                    </tr>`;
                });
                html += '</table>';
                document.getElementById('suspicious').innerHTML = html;
            } else {
                document.getElementById('suspicious').innerHTML = '<p class="success">✅ No suspicious transactions found</p>';
            }
        }
    </script>
</body>

</html>
